[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--config",
  "/home/iddqdld/fiber-optics/.codex/playwright-mcp.json",
]
env = { PLAYWRIGHT_BROWSERS_PATH = "/home/iddqdld/fiber-optics/.playwright-browsers" }
startup_timeout_sec = 30
default_tools_approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_select_option]
approval_mode = "approve"

[features]
default_mode_request_user_input = true
